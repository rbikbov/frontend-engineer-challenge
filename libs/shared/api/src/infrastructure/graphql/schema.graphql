type User {
  id: ID!
  email: String!
  status: String!
}

type AuthPayload {
  accessToken: String!
  refreshToken: String!
  user: User!
}

type TokenPair {
  accessToken: String!
  refreshToken: String!
}

type ResetRequestPayload {
  success: Boolean!
  token: String
}

type Query {
  me: User!
}

type Mutation {
  register(email: String!, password: String!): User!
  login(email: String!, password: String!): AuthPayload!
  refreshToken(refreshToken: String!): TokenPair!
  requestPasswordReset(email: String!): ResetRequestPayload!
  resetPassword(email: String!, token: String!, newPassword: String!): Boolean!
  """
  Log out the user by revoking the provided refresh token.
  Returns true even if the token is invalid or already revoked to ensure an idempotent and smooth UI logout flow.
  """
  logout(refreshToken: String!): Boolean!
}
