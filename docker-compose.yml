services:
  main-app:
    build:
      context: .
      dockerfile: apps/main/Dockerfile
    environment:
      - PORT=4000
      - INTERNAL_DASHBOARD_URL=http://dashboard-app:4001
      - NEXT_PUBLIC_AUTH_BACKEND_TYPE=${NEXT_PUBLIC_AUTH_BACKEND_TYPE:-graphql}
      - NEXT_PUBLIC_AUTH_BACKEND_URL=${NEXT_PUBLIC_AUTH_BACKEND_URL:-http://localhost:8080/graphql}
      - NEXT_PUBLIC_ENV=production
    ports:
      - "4000:4000"

  dashboard-app:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    environment:
      - PORT=4001
      - NEXT_PUBLIC_AUTH_BACKEND_TYPE=${NEXT_PUBLIC_AUTH_BACKEND_TYPE:-graphql}
      - NEXT_PUBLIC_AUTH_BACKEND_URL=${NEXT_PUBLIC_AUTH_BACKEND_URL:-http://localhost:8080/graphql}
      - NEXT_PUBLIC_ENV=production
    ports:
      - "4001:4001"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "3000:3000"
    depends_on:
      - main-app
      - dashboard-app
