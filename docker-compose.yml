networks:
  orbitto-network:
    driver: bridge

services:
  main-app:
    build:
      context: .
      dockerfile: apps/main/Dockerfile
      args:
        - NEXT_PUBLIC_AUTH_BACKEND_TYPE=${NEXT_PUBLIC_AUTH_BACKEND_TYPE:-graphql}
        - NEXT_PUBLIC_AUTH_BACKEND_URL=${NEXT_PUBLIC_AUTH_BACKEND_URL:-http://host.docker.internal:8080/graphql}
        - INTERNAL_DASHBOARD_URL=http://dashboard-app:${DASHBOARD_APP_PORT:-3001}
    restart: unless-stopped
    init: true
    networks:
      - orbitto-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=${MAIN_APP_PORT:-3000}
      - INTERNAL_DASHBOARD_URL=http://dashboard-app:${DASHBOARD_APP_PORT:-3001}
      - NEXT_PUBLIC_AUTH_BACKEND_TYPE=${NEXT_PUBLIC_AUTH_BACKEND_TYPE:-graphql}
      - NEXT_PUBLIC_AUTH_BACKEND_URL=${NEXT_PUBLIC_AUTH_BACKEND_URL:-http://host.docker.internal:8080/graphql}
      - NEXT_PUBLIC_ENV=production
    ports:
      - "${MAIN_APP_PORT:-3000}:${MAIN_APP_PORT:-3000}"

  dashboard-app:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        - NEXT_PUBLIC_AUTH_BACKEND_TYPE=${NEXT_PUBLIC_AUTH_BACKEND_TYPE:-graphql}
        - NEXT_PUBLIC_AUTH_BACKEND_URL=${NEXT_PUBLIC_AUTH_BACKEND_URL:-http://host.docker.internal:8080/graphql}
        - INTERNAL_DASHBOARD_URL=http://localhost:3001
    restart: unless-stopped
    init: true
    networks:
      - orbitto-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - PORT=${DASHBOARD_APP_PORT:-3001}
      - INTERNAL_DASHBOARD_URL=http://localhost:3001
      - NEXT_PUBLIC_AUTH_BACKEND_TYPE=${NEXT_PUBLIC_AUTH_BACKEND_TYPE:-graphql}
      - NEXT_PUBLIC_AUTH_BACKEND_URL=${NEXT_PUBLIC_AUTH_BACKEND_URL:-http://host.docker.internal:8080/graphql}
      - NEXT_PUBLIC_ENV=production
    # Port is NOT exposed to the host, it's internal only.




